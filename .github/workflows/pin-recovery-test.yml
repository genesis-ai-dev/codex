name: Pin recovery Windows installers
on:
  push:
    branches: [codex/pin-recovery-test-builds]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: 5e3c5c76dc6b6adaf0eba488ae064486a4ea0d1b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: pin-recovery-compiled
          run-id: 44099139488
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: Codex-windows-x64-test
          run-id: 44099139488
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore verified app and matching build source
        run: |
          tar -xzf vscode.tar.gz
          7z x Codex-win32-x64-pin-recovery.zip -y
          node -e "const fs=require('fs');const p=require('./VSCode-win32-x64/resources/app/product.json');const v=require('./VSCode-win32-x64/resources/app/package.json');if(p.codexProjectPinPolicy!=='ignore'||v.version!=='1.108.16453'||fs.readFileSync('VSCode-win32-x64/TEST-BUILD-COMMIT.txt','utf8').trim()!=='d49567b20f3d6ecad72c516158cfbd23dad8fc00')throw Error('Unexpected source artifact');"
      - name: Install build-only JavaScript tools
        working-directory: vscode
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix build
      - name: Build unsigned user and system installers
        run: |
          ./build/windows/rtf/make.sh
          cd vscode
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
          npm run gulp vscode-win32-x64-system-setup
          cd ..
          mkdir -p assets
          cp vscode/.build/win32-x64/user-setup/VSCodeSetup.exe assets/CodexUserSetup-x64-1.108.16453-5e3c5c7-test.exe
          cp vscode/.build/win32-x64/system-setup/VSCodeSetup.exe assets/CodexSetup-x64-1.108.16453-5e3c5c7-test.exe
          cd assets
          sha256sum *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Windows-x64-test-installers
          path: assets/*
          retention-days: 7
          if-no-files-found: error
