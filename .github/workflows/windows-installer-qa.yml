name: Verify packaged Windows installer
on:
  push:
    branches: [codex/windows-scope-installer-qa]
permissions:
  contents: read
  actions: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        script: [hosted-wizard, test-machine-worker]
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Codex-scope-installer-x64
          run-id: 45267259531
          github-token: ${{ github.token }}
          path: assets
      - shell: powershell
        run: ./build/windows/setup/staging/${{ matrix.script }}.ps1 -Package (Get-Item assets/CodexInstall-*.exe).FullName
