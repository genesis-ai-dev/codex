name: Package Windows scope installer for QA
on:
  push:
    branches: [codex/windows-scope-installer-qa]
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Codex-scope-installer-x64
          run-id: 45457034940
          github-token: ${{ github.token }}
          path: assets
      - name: Verify approved machine operations on the disposable VM
        shell: powershell
        run: ./build/windows/setup/staging/test-machine-worker.ps1 -Package (Get-Item assets/CodexInstall-*.exe).FullName
      - if: failure()
        shell: powershell
        run: Get-ChildItem "$env:ProgramFiles\Codex" -Force -Recurse | Select-Object -First 40 FullName
