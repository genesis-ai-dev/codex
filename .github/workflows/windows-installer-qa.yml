name: Package Windows scope installer for QA
on:
  push:
    branches: [codex/windows-scope-installer-qa]
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: 585eba7c0c34fd6b30faac7c62a42050bfbc0086
          path: vscode
          persist-credentials: false
          sparse-checkout: |
            build/win32
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Windows-x64-enforce-test
          run-id: 44174974157
          github-token: ${{ github.token }}
          path: previous
      - name: Restore verified application and prepare the shipping Inno script
        shell: bash
        run: |
          (cd previous && sha256sum -c SHA256SUMS.txt)
          unzip -q previous/Codex-Windows-x64-25e74e4-enforce-test.zip
          cp -r src/stable/resources vscode/
          cp LICENSE vscode/LICENSE.txt
          ./build/windows/rtf/make.sh
          sed -i 's/\r$//' vscode/build/win32/code.iss patches/windows/interactive-scope-setup.patch patches/windows/win7.patch
          git -C vscode apply ../patches/windows/interactive-scope-setup.patch
          git -C vscode apply --unidiff-zero ../patches/windows/win7.patch
          sed -i -e 's|https://code.visualstudio.com|https://codex.com|g' -e 's|Microsoft Corporation|Codex|g' vscode/build/win32/code.iss
          curl -fsSL https://registry.npmjs.org/innosetup/-/innosetup-6.4.1.tgz -o compiler.tgz
          test "$(openssl dgst -sha512 -binary compiler.tgz | openssl base64 -A)" = 'Bh/dNlyyFsFKBGoTf19n1msPnm4Njfb0CWVirw2CV1MSJXYy0ajRI+xjo/Yr9DtZFLLafhnwm1ZsxTu309F8lQ=='
          mkdir compiler && tar -xzf compiler.tgz --strip-components=1 -C compiler
      - name: Compile both scoped payloads and verify the compact installer
        shell: powershell
        run: |
          $src = (Resolve-Path VSCode-win32-x64).Path
          $repo = (Resolve-Path vscode).Path
          $manifest = "$src\resources\app\product.json"
          $p = Get-Content $manifest -Raw | ConvertFrom-Json
          $v = '1.108.16453'
          if ($p.version -ne $v -or $p.codexProjectPinPolicy -ne 'enforce') { throw 'Wrong QA application' }
          $assets = (New-Item -ItemType Directory assets).FullName
          foreach ($scope in 'user','system') {
            $dir = (New-Item -ItemType Directory "scope-$scope").FullName
            $p | Add-Member target $scope -Force
            [IO.File]::WriteAllText("$dir\product.json", ($p | ConvertTo-Json -Depth 100))
            $id = if ($scope -eq 'user') { $p.win32x64UserAppId } else { $p.win32x64AppId }
            $name = if ($scope -eq 'user') { $p.win32NameVersion + ' (User)' } else { $p.win32NameVersion }
            $defs = @{NameLong=$p.nameLong; NameShort=$p.nameShort; DirName=$p.win32DirName; Version=$v; RawVersion=$v; Commit=$p.commit; NameVersion=$name; ExeBasename=$p.nameShort; RegValueName=$p.win32RegValueName; ShellNameShort=$p.win32ShellNameShort; AppMutex=$p.win32MutexName; TunnelMutex=$p.win32TunnelMutex; TunnelServiceMutex=$p.win32TunnelServiceMutex; TunnelApplicationName=$p.tunnelApplicationName; ApplicationName=$p.applicationName; Arch='x64'; AppId=$id; IncompatibleTargetAppId=$p.win32x64AppId; AppUserId=$p.win32AppUserModelId; ArchitecturesAllowed='x64'; ArchitecturesInstallIn64BitMode='x64'; SourceDir=$src; RepoDir=$repo; OutputDir=$dir; InstallTarget=$scope; ProductJsonPath="$dir\product.json"; Quality='stable'}
            $arguments = @($defs.Keys | ForEach-Object { "/D$_=$($defs[$_])" })
            & ./compiler/bin/ISCC.exe /Qp @arguments "$repo\build\win32\code.iss"
            if ($LASTEXITCODE) { throw "Inno compile failed for $scope" }
            $prefix = if ($scope -eq 'user') { 'CodexUserSetup' } else { 'CodexSetup' }
            Move-Item "$dir\VSCodeSetup.exe" "$assets\$prefix-x64-$v.exe"
          }
          ./build/windows/setup/bundle.ps1 -Arch x64 -Version $v -ProductPath $manifest -Assets $assets
          $exe = "CodexInstall-x64-$v.exe"
          "$((Get-FileHash "$assets\$exe").Hash.ToLowerInvariant()) *$exe" | Set-Content "$assets\installer.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-scope-installer-x64
          path: |
            assets/CodexInstall-*.exe
            assets/installer.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Exercise the shipping Inno wizard up to Ready to Install
        shell: powershell
        run: ./build/windows/setup/staging/test-wizard.ps1 -Package (Get-Item assets/CodexInstall-*.exe).FullName
